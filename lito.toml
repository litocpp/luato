[package]
name = "luato"
version = "0.1.3"
license = "MIT OR Apache-2.0"

[lib]
name = "luato"
module = "luato"
archive = "luato"

[features.vendored]
default = false

[external-dependencies.pkg-config.lua]
module = "lua5.5"
version = ">= 5.5"
pub = true
condition = "!feature.vendored"

[[test]]
name = "luato-contract"
sources = ["tests/main.cpp", "tests/i18n.cpp", "tests/typed.cpp", "tests/async.cpp", "tests/userdata.cpp", "tests/serde.cpp", "tests/serde_capture.cpp", "tests/memory.cpp"]

[usage]
private-definitions = [
  "LUATO_FIXTURE_DIR=\"tests/fixtures\"",
]

[profile.base]
exceptions = false
rtti = false

[dependencies]
lua = { version = "5.5.1", pub = true, condition = "feature.vendored" }
rstd-std = { version = "0.1.13", pub = true }
rstd-parse = { version = "0.1.13", pub = true }
rstd-serde = { version = "0.1.13", pub = true }
rstd-json = { version = "0.1.13", pub = true }
