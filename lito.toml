[package]
name = "luato"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[lib]
name = "luato"
module = "luato"
archive = "luato"

[[test]]
name = "luato-contract"
sources = ["tests/main.cpp", "tests/i18n.cpp"]

[usage]
private-definitions = [
  "LUATO_FIXTURE_DIR=\"tests/fixtures\"",
]

[[when]]
condition = 'target.os == "linux"'

[when.usage]
private-definitions = ["LUA_USE_LINUX"]

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.0", visibility = "public" }
rstd-parse = { version = "0.1.0", visibility = "public" }
luato-lua = { path = "src/lua", visibility = "public" }
